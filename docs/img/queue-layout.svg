<rect x='470' y='221' width='14' height='14' fill='#e6f0ff' stroke='#1f2328'/><text x='492' y='232' fill='#1f2328'>sentinel</text>
<text x='20' y='268' fill='#6a737d' font-size='12'>Head and tail are separately padded to 128 bytes. Each block has a separately padded header of read</text><text x='20' y='285' fill='#6a737d' font-size='12'>flags; these flags are not another queue index. Unbounded claims use fetch_add or CAS retries;</text><text x='20' y='302' fill='#6a737d' font-size='12'>bounded claims check capacity and use CAS. Consumers check slot state before claiming. Finished</text><text x='20' y='319' fill='#6a737d' font-size='12'>blocks return to a spare slot or pool outside the live chain and stay allocated until the channel is</text><text x='20' y='336' fill='#6a737d' font-size='12'>dropped.</text>
</svg>