<rect x='20' y='126' width='170' height='44' rx='6' fill='#f6f8fa' stroke='#1f2328' stroke-width='1.5'/><text x='105.0' y='146.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>head</text><text x='105.0' y='162.0' text-anchor='middle' fill='#6a737d' font-size='11'>consumers: index, block</text>
