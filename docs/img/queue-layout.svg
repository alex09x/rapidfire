<text x='284' y='172' fill='#6a737d' font-size='11'>index 63 is the sentinel:</text>
<text x='284' y='185' fill='#6a737d' font-size='11'>transition, no value</text>
<rect x='500' y='56' width='230' height='150' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/>
<text x='510' y='76' fill='#1f2328' font-weight='bold'>block 1</text>
<text x='580' y='76' fill='#6a737d' font-size='11'>start = 64, linked</text>
<rect x='510' y='88' width='26' height='26' fill='white' stroke='#1f2328'/>
<rect x='540' y='88' width='26' height='26' fill='white' stroke='#1f2328'/>
