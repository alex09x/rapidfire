<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 330' width='760' height='330' font-family='JetBrains Mono, SFMono-Regular, Menlo, monospace' font-size='12'>
<defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2328'/></marker></defs>
<rect width='760' height='330' fill='white'/>
<text x='16' y='24' font-size='15' font-weight='bold' fill='#1f2328'>Where the channel sits in a trading process</text>
<rect x='20' y='60' width='110' height='40' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='75.0' y='78.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>exchange A</text><text x='75.0' y='94.0' text-anchor='middle' fill='#6a737d' font-size='11'>WebSocket feed</text>
<rect x='170' y='60' width='130' height='40' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='235.0' y='78.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>reader task 1</text><text x='235.0' y='94.0' text-anchor='middle' fill='#6a737d' font-size='11'>parse, timestamp</text>
<line x1='130' y1='80' x2='170' y2='80' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<line x1='300' y1='80' x2='350' y2='120' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='20' y='120' width='110' height='40' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='75.0' y='138.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>exchange B</text><text x='75.0' y='154.0' text-anchor='middle' fill='#6a737d' font-size='11'>WebSocket feed</text>
<rect x='170' y='120' width='130' height='40' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='235.0' y='138.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>reader task 2</text><text x='235.0' y='154.0' text-anchor='middle' fill='#6a737d' font-size='11'>parse, timestamp</text>
<line x1='130' y1='140' x2='170' y2='140' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<line x1='300' y1='140' x2='350' y2='140' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='20' y='180' width='110' height='40' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='75.0' y='198.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>exchange C</text><text x='75.0' y='214.0' text-anchor='middle' fill='#6a737d' font-size='11'>WebSocket feed</text>
<rect x='170' y='180' width='130' height='40' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='235.0' y='198.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>reader task 3</text><text x='235.0' y='214.0' text-anchor='middle' fill='#6a737d' font-size='11'>parse, timestamp</text>
<line x1='130' y1='200' x2='170' y2='200' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<line x1='300' y1='200' x2='350' y2='160' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='350' y='100' width='110' height='80' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.5'/><text x='405.0' y='138.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>channel</text><text x='405.0' y='154.0' text-anchor='middle' fill='#6a737d' font-size='11'>MPMC, lock-free</text>
<line x1='460' y1='140' x2='500' y2='140' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='500' y='110' width='140' height='60' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='570.0' y='138.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>strategy loop</text><text x='570.0' y='154.0' text-anchor='middle' fill='#6a737d' font-size='11'>one pinned thread</text>
<line x1='640' y1='140' x2='670' y2='140' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='670' y='110' width='80' height='60' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='710.0' y='138.0' text-anchor='middle' fill='#1f2328' font-weight='bold'>orders</text><text x='710.0' y='154.0' text-anchor='middle' fill='#6a737d' font-size='11'>gateway</text>
<text x='20' y='250' fill='#6a737d' font-size='12'>Budget: exchange to decision is tens of microseconds end to end, most of it network and parsing. The</text><text x='20' y='267' fill='#6a737d' font-size='12'>hop through the channel is one of the few pieces fully under our control: about 5 ns per message on</text><text x='20' y='284' fill='#6a737d' font-size='12'>Zen 4 in the one-reader case, no lock and no syscall on the hot path, and the same code when forty</text><text x='20' y='301' fill='#6a737d' font-size='12'>readers feed one consumer.</text>
</svg>